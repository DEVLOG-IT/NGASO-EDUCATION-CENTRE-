<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Communication | Ngaso Education Centre</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .top-nav {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e9f2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #174ea6;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-text h2 {
            font-size: 18px;
            color: #174ea6;
            margin-bottom: 3px;
        }

        .brand-text span {
            font-size: 11px;
            color: #777f90;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            border: none;
            background: #eef4ff;
            color: #174ea6;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #dfeaff;
        }

        .logout-btn {
            background: #fff1f1;
            color: #c62828;
        }

        .logout-btn:hover {
            background: #ffe1e1;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #737b8c;
            font-size: 15px;
            line-height: 1.6;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            background: #fff8e1;
            color: #9a6b00;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .communication-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 22px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(25, 48, 90, 0.04);
        }

        .compose-card {
            padding: 23px;
            height: fit-content;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #174ea6;
            font-size: 19px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #39445a;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            padding: 12px 13px;
            outline: none;
            font-size: 14px;
            color: #273247;
            background: #ffffff;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #174ea6;
            box-shadow: 0 0 0 3px rgba(23, 78, 166, 0.08);
        }

        .send-btn {
            width: 100%;
            border: none;
            background: #174ea6;
            color: #ffffff;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .send-btn:hover {
            background: #123f87;
        }

        .messages-card {
            min-width: 0;
        }

        .messages-header {
            padding: 20px;
            border-bottom: 1px solid #edf0f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .messages-header h2 {
            font-size: 20px;
        }

        .message-count {
            color: #777f90;
            font-size: 13px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b93a3;
        }

        .search-box input {
            height: 40px;
            width: 210px;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            outline: none;
            padding: 0 12px 0 37px;
            font-size: 13px;
        }

        .messages-list {
            padding: 18px;
        }

        .message-card {
            border: 1px solid #e7ebf1;
            border-radius: 10px;
            padding: 17px;
            margin-bottom: 13px;
        }

        .message-card:last-child {
            margin-bottom: 0;
        }

        .message-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 10px;
        }

        .sender-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sender-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #edf4ff;
            color: #174ea6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sender-name {
            font-size: 14px;
            font-weight: 700;
            color: #1d2739;
        }

        .sender-role {
            color: #8991a0;
            font-size: 11px;
            margin-top: 3px;
        }

        .message-date {
            color: #8991a0;
            font-size: 11px;
            white-space: nowrap;
        }

        .message-subject {
            font-size: 15px;
            font-weight: 700;
            color: #273247;
            margin-bottom: 7px;
        }

        .message-content {
            color: #687286;
            font-size: 13px;
            line-height: 1.65;
            margin-bottom: 12px;
        }

        .message-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .recipient {
            color: #8a92a1;
            font-size: 11px;
        }

        .delete-message {
            border: none;
            width: 31px;
            height: 31px;
            border-radius: 6px;
            background: #fff0f0;
            color: #c62828;
            cursor: pointer;
        }

        .delete-message:hover {
            background: #ffe0e0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 42px;
            color: #b7bfcc;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #4d5668;
            margin-bottom: 7px;
        }

        .empty-state p {
            color: #8991a0;
            font-size: 13px;
        }

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #172033;
            color: #ffffff;
            padding: 13px 18px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            font-size: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: 0.3s;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 850px) {
            .communication-layout {
                grid-template-columns: 1fr;
            }

            .compose-card {
                order: 1;
            }

            .messages-card {
                order: 2;
            }
        }

        @media (max-width: 650px) {
            .top-nav {
                padding: 0 15px;
                height: 65px;
            }

            .brand-text span {
                display: none;
            }

            .brand-text h2 {
                font-size: 15px;
            }

            .brand-icon {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }

            .nav-btn {
                padding: 9px 11px;
                font-size: 12px;
            }

            .page-container {
                padding: 25px 15px 45px;
            }

            .page-header {
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .messages-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box input {
                width: 100%;
            }

            .message-top {
                flex-direction: column;
            }

            .message-date {
                margin-left: 48px;
            }
        }
    </style>
</head>

<body>

    <header class="top-nav">

        <a href="portal.html" class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div class="brand-text">
                <h2>Ngaso Education Centre</h2>
                <span>School Communication Centre</span>
            </div>

        </a>

        <div class="nav-actions">

            <a href="portal.html" class="nav-btn">
                <i class="fa-solid fa-gauge"></i>
                Dashboard
            </a>

            <button class="nav-btn logout-btn" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </header>


    <main class="page-container">

        <div class="page-header">

            <div>
                <h1>Communication</h1>

                <p>
                    Stay connected with teachers, parents, pupils
                    and the school administration.
                </p>
            </div>

            <div class="role-badge" id="roleBadge">
                <i class="fa-solid fa-user"></i>
                <span>Loading...</span>
            </div>

        </div>


        <div class="communication-layout">


            <section class="card compose-card">

                <h2 class="card-title">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Send a Message
                </h2>


                <form id="messageForm">

                    <div class="form-group">

                        <label for="recipient">
                            Send To
                        </label>

                        <select id="recipient" required>

                            <option value="">
                                Select recipient
                            </option>

                            <option value="Teacher">
                                Teacher
                            </option>

                            <option value="Parent">
                                Parent
                            </option>

                            <option value="Pupil">
                                Pupil
                            </option>

                            <option value="School Administration">
                                School Administration
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="Enter message subject"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="messageContent">
                            Message
                        </label>

                        <textarea
                            id="messageContent"
                            placeholder="Write your message..."
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="send-btn"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        Send Message
                    </button>

                </form>

            </section>


            <section class="card messages-card">

                <div class="messages-header">

                    <div>

                        <h2>Messages</h2>

                        <span
                            class="message-count"
                            id="messageCount"
                        >
                            0 messages
                        </span>

                    </div>


                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            type="search"
                            id="searchInput"
                            placeholder="Search messages..."
                        >

                    </div>

                </div>


                <div
                    class="messages-list"
                    id="messagesList"
                ></div>

            </section>

        </div>

    </main>


    <div
        class="notification"
        id="notification"
    ></div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const currentUserData =
                localStorage.getItem("schoolCurrentUser");


            if (!currentUserData) {

                window.location.href = "login.html";

                return;

            }


            let currentUser;


            try {

                currentUser =
                    JSON.parse(currentUserData);

            } catch (error) {

                localStorage.removeItem(
                    "schoolCurrentUser"
                );

                window.location.href =
                    "login.html";

                return;

            }


            if (!currentUser || !currentUser.role) {

                localStorage.removeItem(
                    "schoolCurrentUser"
                );

                window.location.href =
                    "login.html";

                return;

            }


            const roleBadge =
                document.getElementById("roleBadge");

            const messageForm =
                document.getElementById("messageForm");

            const recipient =
                document.getElementById("recipient");

            const subject =
                document.getElementById("subject");

            const messageContent =
                document.getElementById("messageContent");

            const messagesList =
                document.getElementById("messagesList");

            const messageCount =
                document.getElementById("messageCount");

            const searchInput =
                document.getElementById("searchInput");

            const logoutBtn =
                document.getElementById("logoutBtn");

            const notification =
                document.getElementById("notification");


            function getMessages() {

                try {

                    const messages =
                        JSON.parse(
                            localStorage.getItem("schoolMessages") || "[]"
                        );

                    return Array.isArray(messages)
                        ? messages
                        : [];

                } catch (error) {

                    return [];

                }

            }


            function saveMessages(messages) {

                localStorage.setItem(
                    "schoolMessages",
                    JSON.stringify(messages)
                );

            }


            function escapeHTML(value) {

                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");

            }


            function showNotification(message) {

                notification.textContent =
                    message;

                notification.classList.add(
                    "show"
                );

                setTimeout(function () {

                    notification.classList.remove(
                        "show"
                    );

                }, 3000);

            }


            function formatDate(dateValue) {

                if (!dateValue) {
                    return "Unknown date";
                }

                const date =
                    new Date(dateValue);


                if (isNaN(date.getTime())) {
                    return dateValue;
                }


                return date.toLocaleString(
                    "en-US",
                    {
                        day: "numeric",
                        month: "short",
                        year: "numeric",
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );

            }


            function getRoleIcon(role) {

                const icons = {

                    Admin: "fa-user-shield",

                    Teacher: "fa-chalkboard-user",

                    Parent: "fa-user-group",

                    Pupil: "fa-user-graduate"

                };

                return icons[role] ||
                    "fa-user";

            }


            function setupRole() {

                const role =
                    currentUser.role
                        .charAt(0)
                        .toUpperCase() +
                    currentUser.role
                        .slice(1)
                        .toLowerCase();


                roleBadge.innerHTML =
                    '<i class="fa-solid fa-user"></i>' +
                    '<span>' +
                    escapeHTML(role) +
                    '</span>';


                if (
                    currentUser.role.toLowerCase() ===
                    "pupil"
                ) {

                    recipient.innerHTML = `

                        <option value="">
                            Select recipient
                        </option>

                        <option value="Teacher">
                            Teacher
                        </option>

                        <option value="School Administration">
                            School Administration
                        </option>

                    `;

                }


                if (
                    currentUser.role.toLowerCase() ===
                    "parent"
                ) {

                    recipient.innerHTML = `

                        <option value="">
                            Select recipient
                        </option>

                        <option value="Teacher">
                            Teacher
                        </option>

                        <option value="School Administration">
                            School Administration
                        </option>

                    `;

                }


                if (
                    currentUser.role.toLowerCase() ===
                    "teacher"
                ) {

                    recipient.innerHTML = `

                        <option value="">
                            Select recipient
                        </option>

                        <option value="Parent">
                            Parent
                        </option>

                        <option value="Pupil">
                            Pupil
                        </option>

                        <option value="School Administration">
                            School Administration
                        </option>

                    `;

                }

            }


            function renderMessages() {

                const messages =
                    getMessages();


                const search =
                    searchInput.value
                        .trim()
                        .toLowerCase();


                const filtered =
                    messages.filter(function (message) {

                        const searchableText =
                            (
                                message.subject +
                                " " +
                                message.content +
                                " " +
                                message.sender +
                                " " +
                                message.recipient
                            ).toLowerCase();


                        return (
                            !search ||
                            searchableText.includes(search)
                        );

                    });


                messageCount.textContent =
                    filtered.length +
                    (
                        filtered.length === 1
                            ? " message"
                            : " messages"
                    );


                if (filtered.length === 0) {

                    messagesList.innerHTML = `

                        <div class="empty-state">

                            <i class="fa-regular fa-comments"></i>

                            <h3>No messages found</h3>

                            <p>
                                Your communication messages
                                will appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                messagesList.innerHTML =
                    filtered.map(function (message) {

                        const messageRole =
                            message.senderRole ||
                            "User";


                        return `

                            <article class="message-card">

                                <div class="message-top">

                                    <div class="sender-info">

                                        <div class="sender-icon">

                                            <i class="fa-solid ${getRoleIcon(messageRole)}"></i>

                                        </div>

                                        <div>

                                            <div class="sender-name">
                                                ${escapeHTML(message.sender)}
                                            </div>

                                            <div class="sender-role">
                                                ${escapeHTML(messageRole)}
                                            </div>

                                        </div>

                                    </div>


                                    <span class="message-date">
                                        ${formatDate(message.createdAt)}
                                    </span>

                                </div>


                                <div class="message-subject">
                                    ${escapeHTML(message.subject)}
                                </div>


                                <div class="message-content">
                                    ${escapeHTML(message.content)}
                                </div>


                                <div class="message-footer">

                                    <span class="recipient">
                                        <i class="fa-solid fa-arrow-right"></i>
                                        To: ${escapeHTML(message.recipient)}
                                    </span>


                                    ${
                                        currentUser.role.toLowerCase() === "admin"
                                            ? `
                                                <button
                                                    class="delete-message"
                                                    onclick="deleteMessage('${message.id}')"
                                                    title="Delete message"
                                                >
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            `
                                            : ""
                                    }

                                </div>

                            </article>

                        `;

                    }).join("");

            }


            messageForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    const messageData = {

                        id:
                            Date.now().toString(),

                        sender:
                            currentUser.id,

                        senderRole:
                            currentUser.role,

                        recipient:
                            recipient.value,

                        subject:
                            subject.value.trim(),

                        content:
                            messageContent.value.trim(),

                        createdAt:
                            new Date().toISOString()

                    };


                    if (
                        !messageData.recipient ||
                        !messageData.subject ||
                        !messageData.content
                    ) {

                        showNotification(
                            "Please complete all fields."
                        );

                        return;

                    }


                    const messages =
                        getMessages();


                    messages.unshift(
                        messageData
                    );


                    saveMessages(
                        messages
                    );


                    messageForm.reset();

                    renderMessages();


                    showNotification(
                        "Message sent successfully."
                    );

                }
            );


            window.deleteMessage =
                function (id) {

                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {

                        return;

                    }


                    const confirmed =
                        confirm(
                            "Delete this message?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    const messages =
                        getMessages();


                    const updatedMessages =
                        messages.filter(
                            message =>
                                message.id !== id
                        );


                    saveMessages(
                        updatedMessages
                    );


                    renderMessages();


                    showNotification(
                        "Message deleted."
                    );

                };


            searchInput.addEventListener(
                "input",
                renderMessages
            );


            logoutBtn.addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "schoolCurrentUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );


            setupRole();

            renderMessages();

        });

    </script>

</body>
</html>
