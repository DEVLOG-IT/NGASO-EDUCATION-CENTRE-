<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Materials | Ngaso Education Centre</title>

    <meta name="description" content="Access learning materials, notes, assignments, videos and other academic resources from Ngaso Education Centre.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* TOP NAVIGATION */

        .top-nav {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e9f2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #174ea6;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-text h2 {
            font-size: 18px;
            color: #174ea6;
            margin-bottom: 3px;
        }

        .brand-text span {
            font-size: 11px;
            color: #777f90;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            border: none;
            background: #eef4ff;
            color: #174ea6;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #dfeaff;
        }

        .logout-btn {
            background: #fff1f1;
            color: #c62828;
        }

        .logout-btn:hover {
            background: #ffe1e1;
        }

        /* PAGE */

        .page-container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            color: #172033;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #737b8c;
            font-size: 15px;
            line-height: 1.6;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            background: #fff8e1;
            color: #9a6b00;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* ADMIN PANEL */

        .admin-panel {
            display: none;
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(25, 48, 90, 0.05);
        }

        .admin-panel.show {
            display: block;
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #174ea6;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #39445a;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            padding: 12px 13px;
            outline: none;
            font-size: 14px;
            color: #273247;
            background: #ffffff;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #174ea6;
            box-shadow: 0 0 0 3px rgba(23, 78, 166, 0.08);
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .primary-btn {
            background: #174ea6;
            color: #ffffff;
        }

        .primary-btn:hover {
            background: #123f87;
        }

        .secondary-btn {
            background: #edf1f6;
            color: #4d5668;
        }

        .secondary-btn:hover {
            background: #e2e7ee;
        }

        /* FILTER BAR */

        .filter-bar {
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            padding: 18px;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b93a3;
        }

        .search-box input,
        .filter-bar select {
            width: 100%;
            height: 43px;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            outline: none;
            padding: 0 13px;
            font-size: 14px;
            color: #273247;
            background: #ffffff;
        }

        .search-box input {
            padding-left: 38px;
        }

        .search-box input:focus,
        .filter-bar select:focus {
            border-color: #174ea6;
        }

        /* MATERIALS */

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            font-size: 20px;
            color: #172033;
        }

        .material-count {
            color: #777f90;
            font-size: 13px;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .material-card {
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(25, 48, 90, 0.04);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .material-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(25, 48, 90, 0.08);
        }

        .material-top {
            height: 105px;
            background: #edf4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .material-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #ffffff;
            color: #174ea6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(23, 78, 166, 0.08);
        }

        .material-type {
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #ffffff;
            color: #174ea6;
            font-size: 11px;
            font-weight: 700;
        }

        .material-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .material-content h3 {
            font-size: 17px;
            color: #1d2739;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .material-description {
            color: #70798a;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .material-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 15px;
        }

        .meta-item {
            background: #f4f6f9;
            color: #596376;
            padding: 6px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }

        .meta-item i {
            margin-right: 4px;
            color: #174ea6;
        }

        .material-footer {
            margin-top: auto;
            padding-top: 13px;
            border-top: 1px solid #edf0f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .material-date {
            color: #8991a0;
            font-size: 11px;
        }

        .material-actions {
            display: flex;
            gap: 6px;
        }

        .view-btn,
        .edit-btn,
        .delete-btn {
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view-btn {
            background: #eaf2ff;
            color: #174ea6;
        }

        .edit-btn {
            background: #fff6dc;
            color: #9a6b00;
        }

        .delete-btn {
            background: #fff0f0;
            color: #c62828;
        }

        .view-btn:hover {
            background: #dceaff;
        }

        .edit-btn:hover {
            background: #ffedb7;
        }

        .delete-btn:hover {
            background: #ffe0e0;
        }

        .empty-state {
            background: #ffffff;
            border: 1px dashed #d8dee8;
            border-radius: 12px;
            padding: 55px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 40px;
            color: #b7bfcc;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #4d5668;
            margin-bottom: 7px;
        }

        .empty-state p {
            color: #8991a0;
            font-size: 13px;
        }

        /* NOTIFICATION */

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #172033;
            color: #ffffff;
            padding: 13px 18px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            font-size: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: 0.3s;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* MOBILE */

        @media (max-width: 900px) {
            .materials-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-bar {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 650px) {
            .top-nav {
                padding: 0 15px;
                height: 65px;
            }

            .brand-text span {
                display: none;
            }

            .brand-text h2 {
                font-size: 15px;
            }

            .brand-icon {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }

            .nav-btn {
                padding: 9px 11px;
                font-size: 12px;
            }

            .page-container {
                padding: 25px 15px 45px;
            }

            .page-header {
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .role-badge {
                align-self: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .filter-bar {
                grid-template-columns: 1fr;
            }

            .materials-grid {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="top-nav">

        <a href="portal.html" class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div class="brand-text">
                <h2>Ngaso Education Centre</h2>
                <span>Learning Materials Centre</span>
            </div>
        </a>

        <div class="nav-actions">
            <a href="portal.html" class="nav-btn">
                <i class="fa-solid fa-gauge"></i>
                Dashboard
            </a>

            <button class="nav-btn logout-btn" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>
        </div>

    </header>


    <main class="page-container">

        <div class="page-header">

            <div>
                <h1>Learning Materials</h1>
                <p>
                    Access notes, assignments, videos, links and other
                    educational resources provided by the school.
                </p>
            </div>

            <div class="role-badge" id="roleBadge">
                <i class="fa-solid fa-user"></i>
                <span>Loading...</span>
            </div>

        </div>


        <!-- ADMIN PANEL -->

        <section class="admin-panel" id="adminPanel">

            <h2 class="admin-title">
                <i class="fa-solid fa-book-medical"></i>
                <span id="formTitle">Add Learning Material</span>
            </h2>

            <form id="materialForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="materialTitle">Material Title</label>

                        <input
                            type="text"
                            id="materialTitle"
                            placeholder="Example: Introduction to Algebra"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="subject">Subject</label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="Example: Mathematics"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="classLevel">Class / Grade</label>

                        <select id="classLevel" required>

                            <option value="">Select class</option>

                            <option>Baby Class</option>
                            <option>Grade 1</option>
                            <option>Grade 2</option>
                            <option>Grade 3</option>
                            <option>Grade 4</option>
                            <option>Grade 5</option>
                            <option>Grade 6</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="materialType">Material Type</label>

                        <select id="materialType" required>

                            <option value="">Select type</option>
                            <option value="Notes">Notes</option>
                            <option value="Assignment">Assignment</option>
                            <option value="PDF">PDF</option>
                            <option value="Video">Video</option>
                            <option value="Link">Link</option>
                            <option value="Other">Other</option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="materialDate">Date</label>

                        <input
                            type="date"
                            id="materialDate"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="resourceUrl">Resource Link</label>

                        <input
                            type="url"
                            id="resourceUrl"
                            placeholder="https://example.com/resource"
                            required
                        >
                    </div>


                    <div class="form-group full">
                        <label for="materialDescription">Description</label>

                        <textarea
                            id="materialDescription"
                            placeholder="Write a short description of the learning material..."
                            required
                        ></textarea>
                    </div>

                </div>


                <div class="form-actions">

                    <button type="submit" class="primary-btn">
                        <i class="fa-solid fa-plus"></i>
                        <span id="submitText">Add Material</span>
                    </button>

                    <button
                        type="button"
                        class="secondary-btn"
                        id="clearFormBtn"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <!-- FILTERS -->

        <section class="filter-bar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search learning materials..."
                >

            </div>


            <select id="subjectFilter">
                <option value="all">All Subjects</option>
            </select>


            <select id="classFilter">

                <option value="all">All Classes</option>

                <option>Baby Class</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>

            </select>


            <select id="typeFilter">

                <option value="all">All Types</option>
                <option value="Notes">Notes</option>
                <option value="Assignment">Assignment</option>
                <option value="PDF">PDF</option>
                <option value="Video">Video</option>
                <option value="Link">Link</option>
                <option value="Other">Other</option>

            </select>

        </section>


        <!-- MATERIALS -->

        <section>

            <div class="section-heading">

                <h2>Available Materials</h2>

                <span
                    class="material-count"
                    id="materialCount"
                >
                    0 materials
                </span>

            </div>


            <div
                class="materials-grid"
                id="materialsGrid"
            ></div>

        </section>

    </main>


    <div
        class="notification"
        id="notification"
    ></div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const currentUserData =
                localStorage.getItem("schoolCurrentUser");

            if (!currentUserData) {
                window.location.href = "login.html";
                return;
            }


            let currentUser;

            try {
                currentUser = JSON.parse(currentUserData);
            } catch (error) {
                localStorage.removeItem("schoolCurrentUser");
                window.location.href = "login.html";
                return;
            }


            if (!currentUser || !currentUser.role) {
                localStorage.removeItem("schoolCurrentUser");
                window.location.href = "login.html";
                return;
            }


            const roleBadge =
                document.getElementById("roleBadge");

            const adminPanel =
                document.getElementById("adminPanel");

            const materialForm =
                document.getElementById("materialForm");

            const materialTitle =
                document.getElementById("materialTitle");

            const subject =
                document.getElementById("subject");

            const classLevel =
                document.getElementById("classLevel");

            const materialType =
                document.getElementById("materialType");

            const materialDate =
                document.getElementById("materialDate");

            const resourceUrl =
                document.getElementById("resourceUrl");

            const materialDescription =
                document.getElementById("materialDescription");

            const materialsGrid =
                document.getElementById("materialsGrid");

            const searchInput =
                document.getElementById("searchInput");

            const subjectFilter =
                document.getElementById("subjectFilter");

            const classFilter =
                document.getElementById("classFilter");

            const typeFilter =
                document.getElementById("typeFilter");

            const materialCount =
                document.getElementById("materialCount");

            const clearFormBtn =
                document.getElementById("clearFormBtn");

            const formTitle =
                document.getElementById("formTitle");

            const submitText =
                document.getElementById("submitText");

            const logoutBtn =
                document.getElementById("logoutBtn");

            const notification =
                document.getElementById("notification");


            let editingMaterialId = null;


            function getMaterials() {

                try {

                    const materials =
                        JSON.parse(
                            localStorage.getItem("schoolMaterials") || "[]"
                        );

                    return Array.isArray(materials)
                        ? materials
                        : [];

                } catch (error) {

                    return [];

                }

            }


            function saveMaterials(materials) {

                localStorage.setItem(
                    "schoolMaterials",
                    JSON.stringify(materials)
                );

            }


            function escapeHTML(value) {

                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");

            }


            function formatDate(dateValue) {

                if (!dateValue) {
                    return "No date";
                }

                const date =
                    new Date(dateValue + "T00:00:00");

                if (isNaN(date.getTime())) {
                    return dateValue;
                }

                return date.toLocaleDateString(
                    "en-US",
                    {
                        day: "numeric",
                        month: "short",
                        year: "numeric"
                    }
                );

            }


            function getMaterialIcon(type) {

                const icons = {

                    Notes: "fa-book-open",

                    Assignment: "fa-clipboard-list",

                    PDF: "fa-file-pdf",

                    Video: "fa-circle-play",

                    Link: "fa-link",

                    Other: "fa-folder-open"

                };

                return icons[type] || "fa-folder-open";

            }


            function showNotification(message) {

                notification.textContent = message;

                notification.classList.add("show");

                setTimeout(function () {

                    notification.classList.remove("show");

                }, 3000);

            }


            function setupRole() {

                const role =
                    currentUser.role.toLowerCase();

                roleBadge.innerHTML =
                    '<i class="fa-solid fa-user"></i>' +
                    '<span>' +
                    escapeHTML(
                        currentUser.role.charAt(0).toUpperCase() +
                        currentUser.role.slice(1)
                    ) +
                    '</span>';


                if (role === "admin") {

                    adminPanel.classList.add("show");

                }

            }


            function populateSubjectFilter() {

                const materials =
                    getMaterials();

                const subjects = [
                    ...new Set(
                        materials
                            .map(material => material.subject)
                            .filter(Boolean)
                    )
                ].sort();


                subjectFilter.innerHTML =
                    '<option value="all">All Subjects</option>';


                subjects.forEach(function (item) {

                    const option =
                        document.createElement("option");

                    option.value = item;

                    option.textContent = item;

                    subjectFilter.appendChild(option);

                });

            }


            function renderMaterials() {

                const materials =
                    getMaterials();

                const search =
                    searchInput.value
                        .trim()
                        .toLowerCase();

                const selectedSubject =
                    subjectFilter.value;

                const selectedClass =
                    classFilter.value;

                const selectedType =
                    typeFilter.value;


                const filtered =
                    materials.filter(function (material) {

                        const searchableText =
                            (
                                material.title +
                                " " +
                                material.subject +
                                " " +
                                material.classLevel +
                                " " +
                                material.type +
                                " " +
                                material.description
                            ).toLowerCase();


                        const matchesSearch =
                            !search ||
                            searchableText.includes(search);


                        const matchesSubject =
                            selectedSubject === "all" ||
                            material.subject === selectedSubject;


                        const matchesClass =
                            selectedClass === "all" ||
                            material.classLevel === selectedClass;


                        const matchesType =
                            selectedType === "all" ||
                            material.type === selectedType;


                        return (
                            matchesSearch &&
                            matchesSubject &&
                            matchesClass &&
                            matchesType
                        );

                    });


                materialCount.textContent =
                    filtered.length +
                    (filtered.length === 1
                        ? " material"
                        : " materials");


                if (filtered.length === 0) {

                    materialsGrid.innerHTML = `

                        <div class="empty-state">

                            <i class="fa-solid fa-book-open"></i>

                            <h3>No learning materials found</h3>

                            <p>
                                Try changing your search or filter,
                                or add a new learning material.
                            </p>

                        </div>

                    `;

                    return;

                }


                materialsGrid.innerHTML =
                    filtered.map(function (material) {

                        const isAdmin =
                            currentUser.role.toLowerCase() === "admin";


                        return `

                            <article class="material-card">

                                <div class="material-top">

                                    <div class="material-icon">

                                        <i class="fa-solid ${getMaterialIcon(material.type)}"></i>

                                    </div>

                                    <span class="material-type">
                                        ${escapeHTML(material.type)}
                                    </span>

                                </div>


                                <div class="material-content">

                                    <h3>
                                        ${escapeHTML(material.title)}
                                    </h3>


                                    <p class="material-description">
                                        ${escapeHTML(material.description)}
                                    </p>


                                    <div class="material-meta">

                                        <span class="meta-item">
                                            <i class="fa-solid fa-book"></i>
                                            ${escapeHTML(material.subject)}
                                        </span>

                                        <span class="meta-item">
                                            <i class="fa-solid fa-graduation-cap"></i>
                                            ${escapeHTML(material.classLevel)}
                                        </span>

                                    </div>


                                    <div class="material-footer">

                                        <span class="material-date">
                                            <i class="fa-regular fa-calendar"></i>
                                            ${formatDate(material.date)}
                                        </span>


                                        <div class="material-actions">

                                            <button
                                                class="view-btn"
                                                onclick="openMaterial('${material.id}')"
                                                title="Open material"
                                            >
                                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                            </button>


                                            ${
                                                isAdmin
                                                    ? `
                                                        <button
                                                            class="edit-btn"
                                                            onclick="editMaterial('${material.id}')"
                                                            title="Edit material"
                                                        >
                                                            <i class="fa-solid fa-pen"></i>
                                                        </button>

                                                        <button
                                                            class="delete-btn"
                                                            onclick="deleteMaterial('${material.id}')"
                                                            title="Delete material"
                                                        >
                                                            <i class="fa-solid fa-trash"></i>
                                                        </button>
                                                    `
                                                    : ""
                                            }

                                        </div>

                                    </div>

                                </div>

                            </article>

                        `;

                    }).join("");

            }


            materialForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {

                        showNotification(
                            "Only administrators can add materials."
                        );

                        return;

                    }


                    const materialData = {

                        title:
                            materialTitle.value.trim(),

                        subject:
                            subject.value.trim(),

                        classLevel:
                            classLevel.value,

                        type:
                            materialType.value,

                        date:
                            materialDate.value,

                        resourceUrl:
                            resourceUrl.value.trim(),

                        description:
                            materialDescription.value.trim()

                    };


                    if (
                        !materialData.title ||
                        !materialData.subject ||
                        !materialData.classLevel ||
                        !materialData.type ||
                        !materialData.date ||
                        !materialData.resourceUrl ||
                        !materialData.description
                    ) {

                        showNotification(
                            "Please complete all fields."
                        );

                        return;

                    }


                    const materials =
                        getMaterials();


                    if (editingMaterialId) {

                        const index =
                            materials.findIndex(
                                material =>
                                    material.id ===
                                    editingMaterialId
                            );


                        if (index !== -1) {

                            materials[index] = {

                                ...materials[index],

                                ...materialData,

                                updatedAt:
                                    new Date().toISOString()

                            };

                        }


                        showNotification(
                            "Learning material updated successfully."
                        );

                    } else {

                        materials.unshift({

                            id:
                                Date.now().toString(),

                            ...materialData,

                            postedBy:
                                currentUser.id,

                            createdAt:
                                new Date().toISOString()

                        });


                        showNotification(
                            "Learning material added successfully."
                        );

                    }


                    saveMaterials(materials);

                    clearForm();

                    populateSubjectFilter();

                    renderMaterials();

                }
            );


            clearFormBtn.addEventListener(
                "click",
                clearForm
            );


            function clearForm() {

                materialForm.reset();

                editingMaterialId = null;

                formTitle.textContent =
                    "Add Learning Material";

                submitText.textContent =
                    "Add Material";

                materialDate.value =
                    new Date()
                        .toISOString()
                        .split("T")[0];

            }


            window.editMaterial =
                function (id) {

                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {

                        return;

                    }


                    const materials =
                        getMaterials();

                    const material =
                        materials.find(
                            item => item.id === id
                        );


                    if (!material) {
                        return;
                    }


                    editingMaterialId = id;

                    materialTitle.value =
                        material.title || "";

                    subject.value =
                        material.subject || "";

                    classLevel.value =
                        material.classLevel || "";

                    materialType.value =
                        material.type || "";

                    materialDate.value =
                        material.date || "";

                    resourceUrl.value =
                        material.resourceUrl || "";

                    materialDescription.value =
                        material.description || "";


                    formTitle.textContent =
                        "Edit Learning Material";

                    submitText.textContent =
                        "Update Material";


                    adminPanel.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                };


            window.deleteMaterial =
                function (id) {

                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {

                        return;

                    }


                    const materials =
                        getMaterials();

                    const material =
                        materials.find(
                            item => item.id === id
                        );


                    if (!material) {
                        return;
                    }


                    const confirmed =
                        confirm(
                            "Delete this learning material?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    const updatedMaterials =
                        materials.filter(
                            item => item.id !== id
                        );


                    saveMaterials(updatedMaterials);

                    populateSubjectFilter();

                    renderMaterials();

                    showNotification(
                        "Learning material deleted."
                    );

                };


            window.openMaterial =
                function (id) {

                    const materials =
                        getMaterials();

                    const material =
                        materials.find(
                            item => item.id === id
                        );


                    if (!material || !material.resourceUrl) {

                        showNotification(
                            "This material does not have a valid link."
                        );

                        return;

                    }


                    window.open(
                        material.resourceUrl,
                        "_blank",
                        "noopener,noreferrer"
                    );

                };


            searchInput.addEventListener(
                "input",
                renderMaterials
            );


            subjectFilter.addEventListener(
                "change",
                renderMaterials
            );


            classFilter.addEventListener(
                "change",
                renderMaterials
            );


            typeFilter.addEventListener(
                "change",
                renderMaterials
            );


            logoutBtn.addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "schoolCurrentUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );


            setupRole();

            clearForm();

            populateSubjectFilter();

            renderMaterials();

        });

    </script>

</body>
</html>
