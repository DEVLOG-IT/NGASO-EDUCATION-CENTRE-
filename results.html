<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results | Ngaso Education Centre</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .top-nav {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e9f2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #174ea6;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-text h2 {
            font-size: 18px;
            color: #174ea6;
            margin-bottom: 3px;
        }

        .brand-text span {
            font-size: 11px;
            color: #777f90;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            border: none;
            background: #eef4ff;
            color: #174ea6;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #dfeaff;
        }

        .logout-btn {
            background: #fff1f1;
            color: #c62828;
        }

        .logout-btn:hover {
            background: #ffe1e1;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #737b8c;
            font-size: 15px;
            line-height: 1.6;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            background: #fff8e1;
            color: #9a6b00;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .admin-panel {
            display: none;
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(25, 48, 90, 0.05);
        }

        .admin-panel.show {
            display: block;
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #174ea6;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #39445a;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            padding: 12px 13px;
            outline: none;
            font-size: 14px;
            color: #273247;
            background: #ffffff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #174ea6;
            box-shadow: 0 0 0 3px rgba(23, 78, 166, 0.08);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .primary-btn {
            background: #174ea6;
            color: #ffffff;
        }

        .primary-btn:hover {
            background: #123f87;
        }

        .secondary-btn {
            background: #edf1f6;
            color: #4d5668;
        }

        .filter-bar {
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            padding: 18px;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b93a3;
        }

        .search-box input,
        .filter-bar select {
            width: 100%;
            height: 43px;
            border: 1px solid #dce2eb;
            border-radius: 7px;
            outline: none;
            padding: 0 13px;
            font-size: 14px;
            color: #273247;
            background: #ffffff;
        }

        .search-box input {
            padding-left: 38px;
        }

        .results-wrapper {
            background: #ffffff;
            border: 1px solid #e4e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(25, 48, 90, 0.04);
        }

        .results-header {
            padding: 20px;
            border-bottom: 1px solid #edf0f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h2 {
            font-size: 20px;
        }

        .result-count {
            color: #777f90;
            font-size: 13px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f7f9fc;
            color: #536075;
            font-size: 12px;
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid #e5e9f0;
        }

        td {
            padding: 15px 16px;
            border-bottom: 1px solid #edf0f4;
            font-size: 13px;
            color: #39445a;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fbfcfe;
        }

        .student-name {
            font-weight: 700;
            color: #172033;
        }

        .score {
            font-weight: 700;
            color: #174ea6;
        }

        .grade {
            display: inline-block;
            min-width: 32px;
            text-align: center;
            padding: 5px 8px;
            border-radius: 5px;
            background: #eaf2ff;
            color: #174ea6;
            font-weight: 700;
        }

        .remark {
            color: #667085;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .edit-btn,
        .delete-btn {
            width: 33px;
            height: 33px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-btn {
            background: #fff6dc;
            color: #9a6b00;
        }

        .delete-btn {
            background: #fff0f0;
            color: #c62828;
        }

        .empty-state {
            text-align: center;
            padding: 55px 20px;
        }

        .empty-state i {
            font-size: 42px;
            color: #b7bfcc;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            margin-bottom: 7px;
            color: #4d5668;
        }

        .empty-state p {
            color: #8991a0;
            font-size: 13px;
        }

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #172033;
            color: #ffffff;
            padding: 13px 18px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            font-size: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: 0.3s;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 800px) {
            .filter-bar {
                grid-template-columns: 1fr 1fr;
            }

            .search-box {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 650px) {
            .top-nav {
                padding: 0 15px;
                height: 65px;
            }

            .brand-text span {
                display: none;
            }

            .brand-text h2 {
                font-size: 15px;
            }

            .brand-icon {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }

            .nav-btn {
                padding: 9px 11px;
                font-size: 12px;
            }

            .page-container {
                padding: 25px 15px 45px;
            }

            .page-header {
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .filter-bar {
                grid-template-columns: 1fr;
            }

            .search-box {
                grid-column: auto;
            }

            .form-actions {
                flex-direction: column;
            }

            .primary-btn,
            .secondary-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="top-nav">

        <a href="portal.html" class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div class="brand-text">
                <h2>Ngaso Education Centre</h2>
                <span>Student Results Centre</span>
            </div>

        </a>

        <div class="nav-actions">

            <a href="portal.html" class="nav-btn">
                <i class="fa-solid fa-gauge"></i>
                Dashboard
            </a>

            <button class="nav-btn logout-btn" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </header>


    <main class="page-container">

        <div class="page-header">

            <div>
                <h1>Student Results</h1>

                <p>
                    View academic performance, scores, grades and
                    teacher remarks.
                </p>
            </div>

            <div class="role-badge" id="roleBadge">
                <i class="fa-solid fa-user"></i>
                <span>Loading...</span>
            </div>

        </div>


        <section class="admin-panel" id="adminPanel">

            <h2 class="admin-title">

                <i class="fa-solid fa-square-plus"></i>

                <span id="formTitle">
                    Add Student Result
                </span>

            </h2>


            <form id="resultForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="studentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="studentId">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            placeholder="Example: BFA001"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="classLevel">
                            Class / Grade
                        </label>

                        <select id="classLevel" required>

                            <option value="">
                                Select class
                            </option>

                            <option>Baby Class</option>
                            <option>Grade 1</option>
                            <option>Grade 2</option>
                            <option>Grade 3</option>
                            <option>Grade 4</option>
                            <option>Grade 5</option>
                            <option>Grade 6</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            placeholder="Example: Mathematics"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="score">
                            Score
                        </label>

                        <input
                            type="number"
                            id="score"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="grade">
                            Grade
                        </label>

                        <select id="grade" required>

                            <option value="">
                                Select grade
                            </option>

                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="term">
                            Term
                        </label>

                        <select id="term" required>

                            <option value="">
                                Select term
                            </option>

                            <option>First Term</option>
                            <option>Second Term</option>
                            <option>Third Term</option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="academicYear">
                            Academic Year
                        </label>

                        <input
                            type="text"
                            id="academicYear"
                            placeholder="Example: 2026/2027"
                            required
                        >
                    </div>


                    <div class="form-group full">
                        <label for="remark">
                            Teacher's Remark
                        </label>

                        <input
                            type="text"
                            id="remark"
                            placeholder="Example: Excellent performance"
                            required
                        >
                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        <i class="fa-solid fa-plus"></i>
                        <span id="submitText">
                            Add Result
                        </span>
                    </button>

                    <button
                        type="button"
                        class="secondary-btn"
                        id="clearFormBtn"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <section class="filter-bar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search student, ID or subject..."
                >

            </div>


            <select id="classFilter">

                <option value="all">
                    All Classes
                </option>

                <option>Baby Class</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>

            </select>


            <select id="termFilter">

                <option value="all">
                    All Terms
                </option>

                <option>First Term</option>
                <option>Second Term</option>
                <option>Third Term</option>

            </select>

        </section>


        <section class="results-wrapper">

            <div class="results-header">

                <h2>Academic Results</h2>

                <span
                    class="result-count"
                    id="resultCount"
                >
                    0 results
                </span>

            </div>


            <div class="table-container" id="resultsContainer"></div>

        </section>

    </main>


    <div
        class="notification"
        id="notification"
    ></div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const currentUserData =
                localStorage.getItem("schoolCurrentUser");


            if (!currentUserData) {

                window.location.href = "login.html";

                return;

            }


            let currentUser;


            try {

                currentUser =
                    JSON.parse(currentUserData);

            } catch (error) {

                localStorage.removeItem(
                    "schoolCurrentUser"
                );

                window.location.href =
                    "login.html";

                return;

            }


            if (!currentUser || !currentUser.role) {

                localStorage.removeItem(
                    "schoolCurrentUser"
                );

                window.location.href =
                    "login.html";

                return;

            }


            const roleBadge =
                document.getElementById("roleBadge");

            const adminPanel =
                document.getElementById("adminPanel");

            const resultForm =
                document.getElementById("resultForm");

            const resultsContainer =
                document.getElementById("resultsContainer");

            const resultCount =
                document.getElementById("resultCount");

            const searchInput =
                document.getElementById("searchInput");

            const classFilter =
                document.getElementById("classFilter");

            const termFilter =
                document.getElementById("termFilter");

            const notification =
                document.getElementById("notification");

            const clearFormBtn =
                document.getElementById("clearFormBtn");

            const formTitle =
                document.getElementById("formTitle");

            const submitText =
                document.getElementById("submitText");

            const logoutBtn =
                document.getElementById("logoutBtn");


            const studentName =
                document.getElementById("studentName");

            const studentId =
                document.getElementById("studentId");

            const classLevel =
                document.getElementById("classLevel");

            const subject =
                document.getElementById("subject");

            const score =
                document.getElementById("score");

            const grade =
                document.getElementById("grade");

            const term =
                document.getElementById("term");

            const academicYear =
                document.getElementById("academicYear");

            const remark =
                document.getElementById("remark");


            let editingResultId = null;


            function getResults() {

                try {

                    const results =
                        JSON.parse(
                            localStorage.getItem("schoolResults") || "[]"
                        );

                    return Array.isArray(results)
                        ? results
                        : [];

                } catch (error) {

                    return [];

                }

            }


            function saveResults(results) {

                localStorage.setItem(
                    "schoolResults",
                    JSON.stringify(results)
                );

            }


            function escapeHTML(value) {

                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");

            }


            function showNotification(message) {

                notification.textContent =
                    message;

                notification.classList.add(
                    "show"
                );

                setTimeout(function () {

                    notification.classList.remove(
                        "show"
                    );

                }, 3000);

            }


            function setupRole() {

                const role =
                    currentUser.role.toLowerCase();


                roleBadge.innerHTML =
                    '<i class="fa-solid fa-user"></i>' +
                    '<span>' +
                    escapeHTML(
                        currentUser.role.charAt(0).toUpperCase() +
                        currentUser.role.slice(1)
                    ) +
                    '</span>';


                if (role === "admin") {

                    adminPanel.classList.add(
                        "show"
                    );

                }

            }


            function calculateGrade(value) {

                const number =
                    Number(value);


                if (number >= 80) {
                    return "A";
                }

                if (number >= 70) {
                    return "B";
                }

                if (number >= 60) {
                    return "C";
                }

                if (number >= 50) {
                    return "D";
                }

                if (number >= 40) {
                    return "E";
                }

                return "F";

            }


            score.addEventListener(
                "input",
                function () {

                    if (
                        score.value !== ""
                    ) {

                        grade.value =
                            calculateGrade(
                                score.value
                            );

                    }

                }
            );


            function renderResults() {

                const results =
                    getResults();

                const search =
                    searchInput.value
                        .trim()
                        .toLowerCase();

                const selectedClass =
                    classFilter.value;

                const selectedTerm =
                    termFilter.value;


                const filtered =
                    results.filter(function (result) {

                        const searchableText =
                            (
                                result.studentName +
                                " " +
                                result.studentId +
                                " " +
                                result.subject +
                                " " +
                                result.classLevel
                            ).toLowerCase();


                        const matchesSearch =
                            !search ||
                            searchableText.includes(
                                search
                            );


                        const matchesClass =
                            selectedClass === "all" ||
                            result.classLevel ===
                            selectedClass;


                        const matchesTerm =
                            selectedTerm === "all" ||
                            result.term ===
                            selectedTerm;


                        return (
                            matchesSearch &&
                            matchesClass &&
                            matchesTerm
                        );

                    });


                resultCount.textContent =
                    filtered.length +
                    (
                        filtered.length === 1
                            ? " result"
                            : " results"
                    );


                if (filtered.length === 0) {

                    resultsContainer.innerHTML = `

                        <div class="empty-state">

                            <i class="fa-solid fa-chart-line"></i>

                            <h3>No results found</h3>

                            <p>
                                There are no academic results
                                matching your search or filters.
                            </p>

                        </div>

                    `;

                    return;

                }


                const isAdmin =
                    currentUser.role.toLowerCase() ===
                    "admin";


                resultsContainer.innerHTML = `

                    <table>

                        <thead>

                            <tr>

                                <th>Student</th>
                                <th>Student ID</th>
                                <th>Class</th>
                                <th>Subject</th>
                                <th>Score</th>
                                <th>Grade</th>
                                <th>Term</th>
                                <th>Academic Year</th>
                                <th>Remark</th>

                                ${
                                    isAdmin
                                        ? "<th>Actions</th>"
                                        : ""
                                }

                            </tr>

                        </thead>

                        <tbody>

                            ${
                                filtered.map(function (result) {

                                    return `

                                        <tr>

                                            <td>
                                                <span class="student-name">
                                                    ${escapeHTML(result.studentName)}
                                                </span>
                                            </td>

                                            <td>
                                                ${escapeHTML(result.studentId)}
                                            </td>

                                            <td>
                                                ${escapeHTML(result.classLevel)}
                                            </td>

                                            <td>
                                                ${escapeHTML(result.subject)}
                                            </td>

                                            <td>
                                                <span class="score">
                                                    ${escapeHTML(result.score)}%
                                                </span>
                                            </td>

                                            <td>
                                                <span class="grade">
                                                    ${escapeHTML(result.grade)}
                                                </span>
                                            </td>

                                            <td>
                                                ${escapeHTML(result.term)}
                                            </td>

                                            <td>
                                                ${escapeHTML(result.academicYear)}
                                            </td>

                                            <td>
                                                <span class="remark">
                                                    ${escapeHTML(result.remark)}
                                                </span>
                                            </td>

                                            ${
                                                isAdmin
                                                    ? `

                                                        <td>

                                                            <div class="action-buttons">

                                                                <button
                                                                    class="edit-btn"
                                                                    onclick="editResult('${result.id}')"
                                                                    title="Edit result"
                                                                >
                                                                    <i class="fa-solid fa-pen"></i>
                                                                </button>

                                                                <button
                                                                    class="delete-btn"
                                                                    onclick="deleteResult('${result.id}')"
                                                                    title="Delete result"
                                                                >
                                                                    <i class="fa-solid fa-trash"></i>
                                                                </button>

                                                            </div>

                                                        </td>

                                                    `
                                                    : ""
                                            }

                                        </tr>

                                    `;

                                }).join("")

                            }

                        </tbody>

                    </table>

                `;

            }


            resultForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {

                        showNotification(
                            "Only administrators can manage results."
                        );

                        return;

                    }


                    const resultData = {

                        studentName:
                            studentName.value.trim(),

                        studentId:
                            studentId.value.trim(),

                        classLevel:
                            classLevel.value,

                        subject:
                            subject.value.trim(),

                        score:
                            Number(score.value),

                        grade:
                            grade.value,

                        term:
                            term.value,

                        academicYear:
                            academicYear.value.trim(),

                        remark:
                            remark.value.trim()

                    };


                    if (
                        !resultData.studentName ||
                        !resultData.studentId ||
                        !resultData.classLevel ||
                        !resultData.subject ||
                        resultData.score < 0 ||
                        resultData.score > 100 ||
                        !resultData.grade ||
                        !resultData.term ||
                        !resultData.academicYear ||
                        !resultData.remark
                    ) {

                        showNotification(
                            "Please complete all fields correctly."
                        );

                        return;

                    }


                    const results =
                        getResults();


                    if (editingResultId) {

                        const index =
                            results.findIndex(
                                result =>
                                    result.id ===
                                    editingResultId
                            );


                        if (index !== -1) {

                            results[index] = {

                                ...results[index],

                                ...resultData,

                                updatedAt:
                                    new Date().toISOString()

                            };

                        }


                        showNotification(
                            "Student result updated successfully."
                        );

                    } else {

                        results.unshift({

                            id:
                                Date.now().toString(),

                            ...resultData,

                            postedBy:
                                currentUser.id,

                            createdAt:
                                new Date().toISOString()

                        });


                        showNotification(
                            "Student result added successfully."
                        );

                    }


                    saveResults(results);

                    clearForm();

                    renderResults();

                }
            );


            function clearForm() {

                resultForm.reset();

                editingResultId = null;

                formTitle.textContent =
                    "Add Student Result";

                submitText.textContent =
                    "Add Result";

            }


            clearFormBtn.addEventListener(
                "click",
                clearForm
            );


            window.editResult =
                function (id) {

                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {
                        return;
                    }


                    const results =
                        getResults();

                    const result =
                        results.find(
                            item => item.id === id
                        );


                    if (!result) {
                        return;
                    }


                    editingResultId = id;


                    studentName.value =
                        result.studentName || "";

                    studentId.value =
                        result.studentId || "";

                    classLevel.value =
                        result.classLevel || "";

                    subject.value =
                        result.subject || "";

                    score.value =
                        result.score ?? "";

                    grade.value =
                        result.grade || "";

                    term.value =
                        result.term || "";

                    academicYear.value =
                        result.academicYear || "";

                    remark.value =
                        result.remark || "";


                    formTitle.textContent =
                        "Edit Student Result";

                    submitText.textContent =
                        "Update Result";


                    adminPanel.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                };


            window.deleteResult =
                function (id) {

                    if (
                        currentUser.role.toLowerCase() !==
                        "admin"
                    ) {
                        return;
                    }


                    const confirmed =
                        confirm(
                            "Delete this student result?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    const results =
                        getResults();


                    const updatedResults =
                        results.filter(
                            result =>
                                result.id !== id
                        );


                    saveResults(
                        updatedResults
                    );

                    renderResults();


                    showNotification(
                        "Student result deleted."
                    );

                };


            searchInput.addEventListener(
                "input",
                renderResults
            );


            classFilter.addEventListener(
                "change",
                renderResults
            );


            termFilter.addEventListener(
                "change",
                renderResults
            );


            logoutBtn.addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "schoolCurrentUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );


            setupRole();

            renderResults();

        });

    </script>

</body>
</html>
