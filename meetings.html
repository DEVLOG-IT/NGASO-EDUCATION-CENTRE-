<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Meetings | Ngaso Education Centre</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }


        /* TOP BAR */

        .topbar {
            height: 68px;
            background: #ffffff;
            border-bottom: 1px solid #e5e9f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: #174ea6;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text h2 {
            font-size: 16px;
            color: #17315f;
            margin-bottom: 3px;
        }

        .brand-text span {
            font-size: 11px;
            color: #7c8799;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-btn {
            border: none;
            background: #f0f4fa;
            color: #29436d;
            padding: 10px 15px;
            border-radius: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn:hover {
            background: #e6edf8;
        }

        .logout-btn {
            background: #fff0f0;
            color: #c43b3b;
        }

        .logout-btn:hover {
            background: #ffe2e2;
        }


        /* PAGE */

        .page {
            max-width: 1250px;
            margin: auto;
            padding: 35px 25px 60px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 28px;
        }

        .page-header h1 {
            color: #17315f;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #737d8f;
            font-size: 14px;
        }

        .role-badge {
            background: #fff8e6;
            color: #9b6a00;
            border: 1px solid #efd99c;
            border-radius: 20px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px;
        }


        /* ADMIN PANEL */

        .admin-panel {
            display: none;
            background: #ffffff;
            border: 1px solid #e5e9f0;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 18px rgba(23, 49, 95, 0.04);
        }

        .admin-panel.show {
            display: block;
        }

        .section-title {
            color: #17315f;
            font-size: 19px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #c99a2e;
        }

        .meeting-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #43506a;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #dfe4ec;
            background: #fbfcfe;
            border-radius: 9px;
            padding: 12px 13px;
            outline: none;
            color: #24314a;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #4c7fd6;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(76, 127, 214, 0.09);
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
        }

        .primary-btn,
        .secondary-btn {
            border: none;
            border-radius: 9px;
            padding: 11px 17px;
            font-weight: 700;
        }

        .primary-btn {
            background: #174ea6;
            color: #ffffff;
        }

        .primary-btn:hover {
            background: #123e86;
        }

        .secondary-btn {
            background: #eef2f7;
            color: #42516b;
        }

        .secondary-btn:hover {
            background: #e2e7ef;
        }


        /* TOOLBAR */

        .toolbar {
            background: #ffffff;
            border: 1px solid #e5e9f0;
            border-radius: 15px;
            padding: 17px;
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            box-shadow: 0 5px 18px rgba(23, 49, 95, 0.04);
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa3b3;
        }

        .search-box input {
            width: 100%;
            border: 1px solid #dfe4ec;
            border-radius: 9px;
            padding: 11px 12px 11px 40px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #4c7fd6;
        }

        .filter-select {
            border: 1px solid #dfe4ec;
            border-radius: 9px;
            padding: 11px 13px;
            background: #ffffff;
            color: #42516b;
            outline: none;
        }


        /* MEETINGS */

        .meetings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .meeting-card {
            background: #ffffff;
            border: 1px solid #e5e9f0;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(23, 49, 95, 0.04);
            transition: 0.2s;
        }

        .meeting-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(23, 49, 95, 0.08);
        }

        .meeting-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 16px;
        }

        .meeting-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #edf4ff;
            color: #245ba9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .meeting-status {
            font-size: 10px;
            font-weight: 800;
            background: #edf8f0;
            color: #287544;
            padding: 6px 9px;
            border-radius: 20px;
        }

        .meeting-card h3 {
            color: #17315f;
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .meeting-info {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 11px;
            color: #5e6a7e;
            font-size: 13px;
        }

        .meeting-info i {
            width: 17px;
            color: #c99a2e;
            margin-top: 2px;
        }

        .meeting-description {
            color: #737d8f;
            font-size: 13px;
            line-height: 1.7;
            margin-top: 15px;
        }

        .audience {
            display: inline-flex;
            margin-top: 14px;
            background: #fff8e6;
            color: #9b6a00;
            border-radius: 20px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .meeting-actions {
            border-top: 1px solid #edf0f4;
            margin-top: 17px;
            padding-top: 14px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            border-radius: 7px;
            padding: 8px 11px;
            font-size: 12px;
            font-weight: 700;
        }

        .edit-btn {
            background: #edf4ff;
            color: #245ba9;
        }

        .delete-btn {
            background: #fff0f0;
            color: #c33e3e;
        }


        /* EMPTY */

        .empty-state {
            background: #ffffff;
            border: 1px dashed #d7dde7;
            border-radius: 15px;
            padding: 55px 25px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-state i {
            color: #cbd2dd;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #48556b;
            margin-bottom: 7px;
        }

        .empty-state p {
            color: #8a93a3;
            font-size: 13px;
        }


        /* NOTIFICATION */

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #17315f;
            color: #ffffff;
            padding: 13px 18px;
            border-radius: 9px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.16);
            font-size: 13px;
            z-index: 3000;
        }


        /* RESPONSIVE */

        @media (max-width: 950px) {

            .meetings-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 700px) {

            .topbar {
                padding: 0 17px;
            }

            .brand-text {
                display: none;
            }

            .top-btn span {
                display: none;
            }

            .top-btn {
                width: 40px;
                height: 40px;
                padding: 0;
                justify-content: center;
            }

            .page {
                padding: 25px 15px 45px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .meeting-form {
                grid-template-columns: 1fr;
            }

            .form-group.full,
            .form-actions {
                grid-column: auto;
            }

            .toolbar {
                flex-direction: column;
            }

            .meetings-grid {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>


    <!-- TOP BAR -->

    <header class="topbar">

        <a href="portal.html" class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-school"></i>
            </div>

            <div class="brand-text">
                <h2>Ngaso Education Centre</h2>
                <span>School Management Portal</span>
            </div>

        </a>


        <div class="top-actions">

            <a href="portal.html" class="top-btn">
                <i class="fa-solid fa-gauge-high"></i>
                <span>Dashboard</span>
            </a>

            <button class="top-btn logout-btn" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>

        </div>

    </header>


    <main class="page">


        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <h1>School Meetings</h1>

                <p>
                    Keep track of parent meetings, staff meetings and
                    important school discussions.
                </p>

            </div>


            <div class="role-badge">

                <i class="fa-solid fa-user"></i>

                <span id="roleBadge">
                    Loading...
                </span>

            </div>

        </div>


        <!-- ADMIN PANEL -->

        <section class="admin-panel" id="adminPanel">

            <h2 class="section-title">

                <i class="fa-solid fa-calendar-plus"></i>

                <span id="formHeading">
                    Schedule New Meeting
                </span>

            </h2>


            <form id="meetingForm" class="meeting-form">

                <input
                    type="hidden"
                    id="meetingId"
                >


                <div class="form-group">

                    <label for="meetingTitle">
                        Meeting Title
                    </label>

                    <input
                        type="text"
                        id="meetingTitle"
                        placeholder="Example: Parents' General Meeting"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="meetingDate">
                        Meeting Date
                    </label>

                    <input
                        type="date"
                        id="meetingDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="meetingTime">
                        Meeting Time
                    </label>

                    <input
                        type="time"
                        id="meetingTime"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="meetingVenue">
                        Venue
                    </label>

                    <input
                        type="text"
                        id="meetingVenue"
                        placeholder="Example: School Hall"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="meetingAudience">
                        Audience
                    </label>

                    <select id="meetingAudience" required>

                        <option value="Everyone">
                            Everyone
                        </option>

                        <option value="Parents">
                            Parents
                        </option>

                        <option value="Teachers">
                            Teachers
                        </option>

                        <option value="Pupils">
                            Pupils
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="meetingType">
                        Meeting Type
                    </label>

                    <select id="meetingType" required>

                        <option value="Parents Meeting">
                            Parents Meeting
                        </option>

                        <option value="Staff Meeting">
                            Staff Meeting
                        </option>

                        <option value="Academic Meeting">
                            Academic Meeting
                        </option>

                        <option value="General Meeting">
                            General Meeting
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label for="meetingDescription">
                        Meeting Description
                    </label>

                    <textarea
                        id="meetingDescription"
                        placeholder="Write details about the meeting..."
                        required
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-btn"
                        id="submitMeetingBtn"
                    >
                        <i class="fa-solid fa-plus"></i>
                        Schedule Meeting
                    </button>


                    <button
                        type="button"
                        class="secondary-btn"
                        id="cancelEditBtn"
                        style="display:none;"
                    >
                        Cancel Edit
                    </button>


                    <button
                        type="button"
                        class="secondary-btn"
                        id="clearFormBtn"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <!-- SEARCH -->

        <section class="toolbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="searchMeetings"
                    placeholder="Search meetings..."
                >

            </div>


            <select
                id="meetingTypeFilter"
                class="filter-select"
            >

                <option value="All">
                    All Meeting Types
                </option>

                <option value="Parents Meeting">
                    Parents Meeting
                </option>

                <option value="Staff Meeting">
                    Staff Meeting
                </option>

                <option value="Academic Meeting">
                    Academic Meeting
                </option>

                <option value="General Meeting">
                    General Meeting
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </section>


        <!-- MEETINGS -->

        <section
            class="meetings-grid"
            id="meetingsGrid"
        ></section>


    </main>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* LOGIN CHECK */

                const currentUserData =
                    localStorage.getItem(
                        "schoolCurrentUser"
                    );


                if (!currentUserData) {

                    window.location.href =
                        "login.html";

                    return;

                }


                let currentUser;


                try {

                    currentUser =
                        JSON.parse(
                            currentUserData
                        );

                } catch (error) {

                    localStorage.removeItem(
                        "schoolCurrentUser"
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                if (
                    !currentUser ||
                    !currentUser.role
                ) {

                    localStorage.removeItem(
                        "schoolCurrentUser"
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                const role =
                    currentUser.role;


                /* ELEMENTS */

                const roleBadge =
                    document.getElementById(
                        "roleBadge"
                    );

                const adminPanel =
                    document.getElementById(
                        "adminPanel"
                    );

                const meetingForm =
                    document.getElementById(
                        "meetingForm"
                    );

                const meetingsGrid =
                    document.getElementById(
                        "meetingsGrid"
                    );

                const searchMeetings =
                    document.getElementById(
                        "searchMeetings"
                    );

                const meetingTypeFilter =
                    document.getElementById(
                        "meetingTypeFilter"
                    );


                const meetingId =
                    document.getElementById(
                        "meetingId"
                    );

                const meetingTitle =
                    document.getElementById(
                        "meetingTitle"
                    );

                const meetingDate =
                    document.getElementById(
                        "meetingDate"
                    );

                const meetingTime =
                    document.getElementById(
                        "meetingTime"
                    );

                const meetingVenue =
                    document.getElementById(
                        "meetingVenue"
                    );

                const meetingAudience =
                    document.getElementById(
                        "meetingAudience"
                    );

                const meetingType =
                    document.getElementById(
                        "meetingType"
                    );

                const meetingDescription =
                    document.getElementById(
                        "meetingDescription"
                    );

                const formHeading =
                    document.getElementById(
                        "formHeading"
                    );

                const submitMeetingBtn =
                    document.getElementById(
                        "submitMeetingBtn"
                    );

                const cancelEditBtn =
                    document.getElementById(
                        "cancelEditBtn"
                    );

                const clearFormBtn =
                    document.getElementById(
                        "clearFormBtn"
                    );


                /* ROLE */

                roleBadge.textContent =
                    role.charAt(0).toUpperCase() +
                    role.slice(1);


                if (
                    role.toLowerCase() ===
                    "admin"
                ) {

                    adminPanel.classList.add(
                        "show"
                    );

                }


                /* STORAGE */

                function getMeetings() {

                    try {

                        const meetings =
                            JSON.parse(
                                localStorage.getItem(
                                    "schoolMeetings"
                                ) || "[]"
                            );

                        return Array.isArray(meetings)
                            ? meetings
                            : [];

                    } catch (error) {

                        return [];

                    }

                }


                function saveMeetings(
                    meetings
                ) {

                    localStorage.setItem(
                        "schoolMeetings",
                        JSON.stringify(
                            meetings
                        )
                    );

                }


                /* HELPERS */

                function escapeHTML(
                    value
                ) {

                    return String(
                        value || ""
                    )
                    .replace(
                        /&/g,
                        "&amp;"
                    )
                    .replace(
                        /</g,
                        "&lt;"
                    )
                    .replace(
                        />/g,
                        "&gt;"
                    )
                    .replace(
                        /"/g,
                        "&quot;"
                    )
                    .replace(
                        /'/g,
                        "&#039;"
                    );

                }


                function formatDate(
                    dateValue
                ) {

                    if (!dateValue) {

                        return "Date not available";

                    }


                    const date =
                        new Date(
                            dateValue +
                            "T00:00:00"
                        );


                    if (
                        Number.isNaN(
                            date.getTime()
                        )
                    ) {

                        return dateValue;

                    }


                    return date.toLocaleDateString(
                        "en-GB",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    );

                }


                function formatTime(
                    timeValue
                ) {

                    if (!timeValue) {

                        return "Time not available";

                    }


                    const parts =
                        timeValue.split(":");


                    if (
                        parts.length < 2
                    ) {

                        return timeValue;

                    }


                    let hour =
                        Number(parts[0]);

                    const minute =
                        parts[1];

                    const period =
                        hour >= 12
                            ? "PM"
                            : "AM";


                    hour =
                        hour % 12;


                    if (hour === 0) {

                        hour = 12;

                    }


                    return (
                        hour +
                        ":" +
                        minute +
                        " " +
                        period
                    );

                }


                function showNotification(
                    message
                ) {

                    const old =
                        document.querySelector(
                            ".notification"
                        );


                    if (old) {

                        old.remove();

                    }


                    const notification =
                        document.createElement(
                            "div"
                        );


                    notification.className =
                        "notification";

                    notification.textContent =
                        message;


                    document.body.appendChild(
                        notification
                    );


                    setTimeout(
                        function () {

                            notification.remove();

                        },
                        3000
                    );

                }


                function resetForm() {

                    meetingForm.reset();

                    meetingId.value = "";

                    formHeading.textContent =
                        "Schedule New Meeting";

                    submitMeetingBtn.innerHTML =
                        '<i class="fa-solid fa-plus"></i> Schedule Meeting';

                    cancelEditBtn.style.display =
                        "none";

                }


                /* DISPLAY MEETINGS */

                function renderMeetings() {

                    const meetings =
                        getMeetings();


                    const searchTerm =
                        searchMeetings.value
                            .trim()
                            .toLowerCase();


                    const selectedType =
                        meetingTypeFilter.value;


                    const filtered =
                        meetings
                        .filter(
                            function (meeting) {

                                const text =
                                    (
                                        meeting.title +
                                        " " +
                                        meeting.description +
                                        " " +
                                        meeting.venue
                                    ).toLowerCase();


                                const matchesSearch =
                                    text.includes(
                                        searchTerm
                                    );


                                const matchesType =
                                    selectedType ===
                                    "All" ||
                                    meeting.type ===
                                    selectedType;


                                return (
                                    matchesSearch &&
                                    matchesType
                                );

                            }
                        )
                        .sort(
                            function (a, b) {

                                const first =
                                    new Date(
                                        `${a.date}T${a.time || "00:00"}`
                                    );

                                const second =
                                    new Date(
                                        `${b.date}T${b.time || "00:00"}`
                                    );


                                return (
                                    first - second
                                );

                            }
                        );


                    if (
                        filtered.length === 0
                    ) {

                        meetingsGrid.innerHTML = `

                            <div class="empty-state">

                                <i class="fa-regular fa-calendar-xmark"></i>

                                <h3>
                                    No meetings found
                                </h3>

                                <p>
                                    There are no meetings matching your search or filter.
                                </p>

                            </div>

                        `;

                        return;

                    }


                    meetingsGrid.innerHTML =
                        filtered.map(
                            function (meeting) {


                                const adminActions =
                                    role.toLowerCase() ===
                                    "admin"

                                        ? `

                                            <div class="meeting-actions">

                                                <button
                                                    class="edit-btn"
                                                    onclick="editMeeting('${meeting.id}')"
                                                >
                                                    <i class="fa-solid fa-pen"></i>
                                                    Edit
                                                </button>

                                                <button
                                                    class="delete-btn"
                                                    onclick="deleteMeeting('${meeting.id}')"
                                                >
                                                    <i class="fa-solid fa-trash"></i>
                                                    Delete
                                                </button>

                                            </div>

                                        `

                                        : "";


                                return `

                                    <article class="meeting-card">

                                        <div class="meeting-card-header">

                                            <div class="meeting-icon">
                                                <i class="fa-solid fa-people-group"></i>
                                            </div>

                                            <span class="meeting-status">
                                                SCHEDULED
                                            </span>

                                        </div>


                                        <h3>
                                            ${escapeHTML(
                                                meeting.title
                                            )}
                                        </h3>


                                        <div class="meeting-info">

                                            <i class="fa-regular fa-calendar"></i>

                                            <span>
                                                ${escapeHTML(
                                                    formatDate(
                                                        meeting.date
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="meeting-info">

                                            <i class="fa-regular fa-clock"></i>

                                            <span>
                                                ${escapeHTML(
                                                    formatTime(
                                                        meeting.time
                                                    )
                                                )}
                                            </span>

                                        </div>


                                        <div class="meeting-info">

                                            <i class="fa-solid fa-location-dot"></i>

                                            <span>
                                                ${escapeHTML(
                                                    meeting.venue
                                                )}
                                            </span>

                                        </div>


                                        <div class="meeting-info">

                                            <i class="fa-solid fa-layer-group"></i>

                                            <span>
                                                ${escapeHTML(
                                                    meeting.type
                                                )}
                                            </span>

                                        </div>


                                        <span class="audience">

                                            <i class="fa-solid fa-users"></i>

                                            &nbsp;

                                            ${escapeHTML(
                                                meeting.audience
                                            )}

                                        </span>


                                        <p class="meeting-description">

                                            ${escapeHTML(
                                                meeting.description
                                            )}

                                        </p>


                                        ${adminActions}

                                    </article>

                                `;

                            }
                        )
                        .join("");

                }


                /* SAVE OR UPDATE */

                meetingForm.addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();


                        if (
                            role.toLowerCase() !==
                            "admin"
                        ) {

                            showNotification(
                                "Only administrators can manage meetings."
                            );

                            return;

                        }


                        const title =
                            meetingTitle.value.trim();

                        const date =
                            meetingDate.value;

                        const time =
                            meetingTime.value;

                        const venue =
                            meetingVenue.value.trim();

                        const audience =
                            meetingAudience.value;

                        const type =
                            meetingType.value;

                        const description =
                            meetingDescription.value.trim();


                        if (
                            !title ||
                            !date ||
                            !time ||
                            !venue ||
                            !audience ||
                            !type ||
                            !description
                        ) {

                            showNotification(
                                "Please complete all meeting fields."
                            );

                            return;

                        }


                        const meetings =
                            getMeetings();


                        const editingId =
                            meetingId.value;


                        if (editingId) {

                            const index =
                                meetings.findIndex(
                                    function (meeting) {

                                        return (
                                            meeting.id ===
                                            editingId
                                        );

                                    }
                                );


                            if (index !== -1) {

                                meetings[index] = {

                                    ...meetings[index],

                                    title: title,

                                    date: date,

                                    time: time,

                                    venue: venue,

                                    audience: audience,

                                    type: type,

                                    description:
                                        description,

                                    updatedAt:
                                        new Date()
                                            .toISOString()

                                };


                                saveMeetings(
                                    meetings
                                );


                                showNotification(
                                    "Meeting updated successfully."
                                );

                            }

                        } else {

                            const newMeeting = {

                                id:
                                    Date.now()
                                        .toString(),

                                title: title,

                                date: date,

                                time: time,

                                venue: venue,

                                audience:
                                    audience,

                                type: type,

                                description:
                                    description,

                                postedBy:
                                    currentUser.id,

                                createdAt:
                                    new Date()
                                        .toISOString()

                            };


                            meetings.push(
                                newMeeting
                            );


                            saveMeetings(
                                meetings
                            );


                            showNotification(
                                "Meeting scheduled successfully."
                            );

                        }


                        resetForm();

                        renderMeetings();

                    }
                );


                /* EDIT */

                window.editMeeting =
                    function (id) {

                        if (
                            role.toLowerCase() !==
                            "admin"
                        ) {

                            return;

                        }


                        const meetings =
                            getMeetings();


                        const meeting =
                            meetings.find(
                                function (item) {

                                    return (
                                        item.id ===
                                        id
                                    );

                                }
                            );


                        if (!meeting) {

                            return;

                        }


                        meetingId.value =
                            meeting.id;

                        meetingTitle.value =
                            meeting.title;

                        meetingDate.value =
                            meeting.date;

                        meetingTime.value =
                            meeting.time;

                        meetingVenue.value =
                            meeting.venue;

                        meetingAudience.value =
                            meeting.audience;

                        meetingType.value =
                            meeting.type;

                        meetingDescription.value =
                            meeting.description;


                        formHeading.textContent =
                            "Edit Meeting";

                        submitMeetingBtn.innerHTML =
                            '<i class="fa-solid fa-floppy-disk"></i> Save Changes';

                        cancelEditBtn.style.display =
                            "inline-block";


                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    };


                /* DELETE */

                window.deleteMeeting =
                    function (id) {

                        if (
                            role.toLowerCase() !==
                            "admin"
                        ) {

                            return;

                        }


                        const meetings =
                            getMeetings();


                        const meeting =
                            meetings.find(
                                function (item) {

                                    return (
                                        item.id ===
                                        id
                                    );

                                }
                            );


                        if (!meeting) {

                            return;

                        }


                        const confirmed =
                            confirm(
                                `Delete "${meeting.title}" from school meetings?`
                            );


                        if (!confirmed) {

                            return;

                        }


                        const updated =
                            meetings.filter(
                                function (item) {

                                    return (
                                        item.id !==
                                        id
                                    );

                                }
                            );


                        saveMeetings(
                            updated
                        );


                        renderMeetings();


                        showNotification(
                            "Meeting deleted successfully."
                        );

                    };


                /* BUTTONS */

                cancelEditBtn.addEventListener(
                    "click",
                    function () {

                        resetForm();

                    }
                );


                clearFormBtn.addEventListener(
                    "click",
                    function () {

                        resetForm();

                    }
                );


                /* SEARCH */

                searchMeetings.addEventListener(
                    "input",
                    renderMeetings
                );


                meetingTypeFilter.addEventListener(
                    "change",
                    renderMeetings
                );


                /* LOGOUT */

                document
                    .getElementById(
                        "logoutBtn"
                    )
                    .addEventListener(
                        "click",
                        function () {

                            localStorage.removeItem(
                                "schoolCurrentUser"
                            );

                            window.location.href =
                                "login.html";

                        }
                    );


                /* INITIAL DISPLAY */

                renderMeetings();

            }
        );

    </script>

</body>
</html>
